name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sources:
    name: Build sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bootstrap and configure
        run: ./bootstrap && ./configure

      - name: Check the version against the tag
        if: github.ref_type == 'tag'
        run: test "$(build-aux/version.sh)" = "${{ github.ref_name }}"

      - name: Build and check the source packages
        run: make -j4 distcheck

      - name: Build the other package formats
        run: |
          v=$(build-aux/version.sh)
          bzip2 -d -k bzip3-$v.tar.bz2
          zstd -19 -k bzip3-$v.tar
          make -j4
          ./bzip3 -e bzip3-$v.tar

      - name: Upload the source packages
        uses: actions/upload-artifact@v7
        with:
          name: sources
          path: |
            bzip3-*.tar
            bzip3-*.tar.*
            bzip3-*.zip

  binaries:
    name: Build ${{ matrix.target.name }}
    needs: [ sources ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64-linux
            configure: CC=musl-gcc
            packages: musl-tools
          - name: x86_64
            configure: --host=x86_64-w64-mingw32 CC=x86_64-w64-mingw32-gcc
            packages: gcc-mingw-w64-x86-64
          - name: i686
            configure: --host=i686-w64-mingw32 CC=i686-w64-mingw32-gcc
            packages: gcc-mingw-w64-i686
    steps:
      - name: Download the source packages
        uses: actions/download-artifact@v8
        with:
          name: sources

      - name: Extract source package
        run: |
          tar --strip-components=1 -mxf bzip3-*.tar.gz
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.target.packages }}

      - name: Configure
        run: |
          ./configure --bindir=/ --program-suffix=-${{ matrix.target.name }} \
                      --disable-shared --enable-static-exe ${{ matrix.target.configure }}

      - name: Make
        run: |
          make -j4
          make DESTDIR=$PWD/output install-binPROGRAMS

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target.name }}
          path: output/bzip3-${{ matrix.target.name }}*

  publish:
    name: Publish the release
    needs: [ sources, binaries ]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download everything
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bzip3-*
