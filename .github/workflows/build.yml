name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * 5'  # Every Friday at 2am

jobs:

  dist:
    name: Package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Configure
      run: |
        ./bootstrap.sh
        ./configure
    - name: Make source package
      run: make VERSION=${{ github.sha }} dist
    - name: Upload source package artifact
      uses: actions/upload-artifact@v7
      with:
        name: bzip3-${{ github.sha }}
        path: bzip3-${{ github.sha }}.tar.gz
    - name: Run distcheck
      run: make distcheck

  build:
    name: Build Matrix
    needs: [ dist ]
    strategy:
      fail-fast: false
      matrix:
        platform: [ ubuntu-latest, macos-latest ]
        compiler: [ clang, gcc ]
        feature: [ with-pthread, without-pthread ]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Download source package artifact
      uses: actions/download-artifact@v8
      with:
        name: bzip3-${{ github.sha }}
    - name: Extract source package
      run: tar --strip-components=1 -xf bzip3-${{ github.sha}}.tar.gz
    - name: Configure
      run: ./configure CC=${{ matrix.compiler }} --${{ matrix.feature }}
    - name: Make
      run: make
    - name: Check
      run: make check roundtrip || { cat test-suite.log; exit 1; }

  build-archs:
    name: Build Matrix for non-x86 architectures (Debian Bookworm)
    needs: [ dist ]
    strategy:
      fail-fast: false
      matrix:
        compiler: [ clang, gcc ]
        feature: [ with-pthread, without-pthread ]
        arch: [ armv6, armv7, aarch64, s390x, ppc64le ]
    runs-on: ubuntu-latest
    steps:
    - name: Download source package artifact
      uses: actions/download-artifact@v8
      with:
        name: bzip3-${{ github.sha }}
    - name: Extract source package
      run: tar --strip-components=1 -xf bzip3-${{ github.sha}}.tar.gz
    - uses: uraimo/run-on-arch-action@v3
      name: Run in the container
      with:
        arch: ${{ matrix.arch }}
        distro: bookworm
        shell: /bin/sh
        dockerRunArgs: |
          --volume "${PWD}:/bzip3"
        install: |
          apt update -q -y
          apt install -q -y clang gcc make pkg-config
        run: |
          cd /bzip3
          if [ ${{ matrix.arch }} = armv6 -a ${{ matrix.compiler }} = clang ]; then
            export CFLAGS='-march=armv6'  # or we get "Illegal instruction" crashes
          fi
          ./configure CC=${{ matrix.compiler }} --${{ matrix.feature }} --disable-arch-native
          make && { make check roundtrip || { cat test-suite.log; exit 1; }; }
  build-archs-ubuntu:
    name: Build Matrix for non-x86 architectures (Ubuntu Latest)
    needs: [ dist ]
    strategy:
      fail-fast: false
      matrix:
        compiler: [ clang, gcc ]
        feature: [ with-pthread, without-pthread ]
        arch: [ riscv64 ]
    runs-on: ubuntu-latest
    steps:
    - name: Download source package artifact
      uses: actions/download-artifact@v8
      with:
        name: bzip3-${{ github.sha }}
    - name: Extract source package
      run: tar --strip-components=1 -xf bzip3-${{ github.sha}}.tar.gz
    - uses: uraimo/run-on-arch-action@v3
      name: Run in the container
      with:
        arch: ${{ matrix.arch }}
        distro: ubuntu_latest
        shell: /bin/sh
        dockerRunArgs: |
          --volume "${PWD}:/bzip3"
        install: |
          apt update -q -y
          apt install -q -y clang gcc make pkg-config
        run: |
          cd /bzip3
          ./configure CC=${{ matrix.compiler }} --${{ matrix.feature }} --disable-arch-native
          make && { make check roundtrip || { cat test-suite.log; exit 1; }; }

  sanitizers:
    name: Test suite under ASan and UBSan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Configure
      run: |
        ./bootstrap.sh
        ./configure CC=clang CFLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
    - name: Make
      run: make
    - name: Check
      run: make check || { cat test-suite.log; exit 1; }
    - name: Decode a file from an older release
      run: make test

  cmake:
    name: Build with CMake
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shared: [ "ON", "OFF" ]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # the version is derived from the tags
    - name: Configure
      run: cmake -B build -DBUILD_SHARED_LIBS=${{ matrix.shared }}
    - name: Build
      run: cmake --build build
    - name: Test
      run: ctest --test-dir build --output-on-failure
